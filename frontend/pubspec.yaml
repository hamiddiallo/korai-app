version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.5.4
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^9.1.1
  sqflite_sqlcipher: ^3.4.0
  path_provider: ^2.1.5
