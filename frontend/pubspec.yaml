name: korai_frontend
description: Assistant mobile ORL pour soins primaires.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.5.4
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^9.1.1
  sqflite_sqlcipher: ^3.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^7.1.1
  uuid: ^4.5.3
  http_parser: ^4.1.2
  crypto: ^3.0.3
  flutter_dotenv: ^6.0.1
  local_auth: ^3.0.2
  local_auth_android: ^2.0.8
  local_auth_darwin: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/OFL-Sora.txt
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt
    - assets/fonts/OFL-AtkinsonHyperlegibleMono.txt

  # Polices embarquées (SIL Open Font License) : l'app fonctionne hors ligne.
  # Noms de familles = KFonts (lib/core/design/korai_tokens.dart).
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700
